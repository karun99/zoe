[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zoe"
version = "4.0.0"
description = "Project Zoe - a connectome-based reservoir computing companion with biologically-inspired control layers, an evolving LoRA adapter, a virtual avatar, a sandboxed MicroVM, and companion mode."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "karun99", email = "karun99@users.noreply.github.com" }]
keywords = ["agentic-ai", "reservoir-computing", "connectome", "lora", "companion", "mcp", "neuromorphic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
llm = ["llama-cpp-python>=0.3.36"]
flybrain = ["flybrain"]
companion = ["mss", "pytesseract"]
api = ["fastapi", "uvicorn"]
dev = ["pytest>=7.0", "pytest-cov"]

[project.scripts]
zoe = "zoe.cli:main"
zoe-mcp = "zoe.mcp_server:main"

[tool.setuptools.packages.find]
include = ["zoe*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["zoe"]
